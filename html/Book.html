<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELAX</title>
    <link rel="stylesheet" href="../css/book.css">
</head>
<body>
    
    <div class="container">
        <div class="check-box">
            <h2>confirm Booking</h2>
    <div class="row">
        <div class="field">
            <label>Check in date</label>
            <input id="checkIn" type="date">
        </div>
        
        <div class="field">
            <label>Check out date</label>
            <input id="checkOut" type="date">
        </div>
     </div>
            <div class="row">
                <select  id="adult">
                    <option value="" selected disabled>Adult</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
    
                <select id="children">
                    <option value="" selected disabled>Children</option>
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                </select>
            </div>
    
            <select id="roomType">
                <option value="" selected disabled>Room type</option>
                <option>Luxury Room</option>
                <option>Deluxe Room</option>
                <option>Signature Room</option>
            </select>
             
            <button id="confirm">Confirm</button>
        </div>
    </div>

    <script src="../js/book.js"></script>
    </body>
</html>
